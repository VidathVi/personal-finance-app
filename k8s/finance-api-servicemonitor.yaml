apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: finance-api-servicemonitor
  namespace: default
  labels:
    release: monitoring
    app: finance-api
spec:
  selector:
    matchLabels:
      app: finance-api
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
